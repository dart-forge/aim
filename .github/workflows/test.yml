name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Node (wrangler for aim_edge tests)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-wrangler

      - name: Warm wrangler
        run: npx --yes wrangler@4 --version

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-

      - name: Get dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-warnings .

      - name: Test
        # Runs `dart test` in every package that has one, skipping any
        # directory with no test/ folder or with no *_test.dart file in it
        # (dart test exits 79 on an empty suite, which would fail the job
        # for nothing). Suites that need a Postgres server or a download are
        # tagged `integration` (or `slow` for the build_runner golden tests)
        # and skipped by default via each package's dart_test.yaml.
        run: |
          fail=0
          for dir in packages/*/ examples/*/ tools/*/; do
            dir="${dir%/}"
            if [ ! -d "$dir/test" ]; then
              continue
            fi
            if ! find "$dir/test" -name '*_test.dart' -print -quit | grep -q .; then
              continue
            fi
            echo "::group::dart test in $dir"
            if ! (cd "$dir" && dart test); then
              echo "FAILED: $dir"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Test aim_edge integration (wrangler dev)
        # Node is set up and wrangler is already warmed above.
        working-directory: packages/aim_edge
        run: dart test -t integration --run-skipped

      - name: Docker is reachable
        # The Postgres suites below start their own containers. Fail here,
        # with docker's own diagnosis, rather than inside a setUpAll where it
        # reads as a test failure.
        run: docker info

      # These used to need `docker compose up` before anything, which is why
      # they never ran here. They now start what they need themselves, and a
      # runner is a cold machine — so this is also the only place the image
      # pull and initdb get exercised, paths a developer's machine skips by
      # reusing containers from the last run.
      - name: Test aim_postgres integration (Postgres via rig)
        working-directory: packages/aim_postgres
        run: dart test -t integration --run-skipped

      - name: Test aim_orm_codegen integration (Postgres via rig)
        working-directory: packages/aim_orm_codegen
        run: dart test -t integration --run-skipped

      - name: Containers left behind
        # rig leaves containers running on purpose; on a throwaway runner that
        # costs nothing. Printed so a failing run shows what was up.
        if: always()
        run: docker ps -a --filter label=dev.dart-forge.rig
