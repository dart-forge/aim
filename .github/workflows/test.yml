name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Node (wrangler for aim_edge tests)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-wrangler

      - name: Warm wrangler
        run: npx --yes wrangler@4 --version

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-

      - name: Get dependencies
        run: dart pub get

      - name: Run tests for aim_core
        working-directory: packages/aim_core
        run: dart test

      - name: Run tests for aim_server
        working-directory: packages/aim_server
        run: dart test

      - name: Run tests for aim_edge
        working-directory: packages/aim_edge
        run: dart test

      - name: Run tests for aim_cli
        working-directory: packages/aim_cli
        run: dart test

      - name: Run tests for aim_postgres (unit)
        working-directory: packages/aim_postgres
        run: dart test test/unit/

      - name: Run tests for aim_server_form
        working-directory: packages/aim_server_form
        run: dart test

      - name: Run tests for aim_server_multipart
        working-directory: packages/aim_server_multipart
        run: dart test

      - name: Run tests for aim_server_testing
        working-directory: packages/aim_server_testing
        run: dart test

      - name: Run tests for aim_server_static
        working-directory: packages/aim_server_static
        run: dart test

      - name: Run tests for aim_server_logger
        working-directory: packages/aim_server_logger
        run: dart test

      - name: Run tests for aim_server_sse
        working-directory: packages/aim_server_sse
        run: dart test

      - name: Run tests for aim_server_jwt
        working-directory: packages/aim_server_jwt
        run: dart test

      - name: Run tests for aim_server_basic_auth
        working-directory: packages/aim_server_basic_auth
        run: dart test

      - name: Analyze code
        run: dart analyze --fatal-warnings

