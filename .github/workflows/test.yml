name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Node (wrangler for aim_edge tests)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-wrangler

      - name: Warm wrangler
        run: npx --yes wrangler@4 --version

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-

      - name: Get dependencies
        run: dart pub get

      - name: Install rask
        # The command comes from pub.dev; the library rask.dart compiles
        # against is pinned by the root pubspec (dev_dependencies: rask).
        # dart install puts binaries under the Dart state directory
        # ($HOME/.local/state/Dart on Linux); the test fails loudly if that moves.
        run: |
          dart install rask_cli
          bin="${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin"
          test -x "$bin/rask"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Analyze
        # rask.dart's analyze task adds --fatal-warnings; runs per package, in parallel.
        run: rask analyze -j 4

      - name: Test
        # No filters: every package's self-contained tests run. Suites that
        # need a Postgres server or a download are tagged `integration` (or
        # `slow` for the build_runner golden tests) and skipped by default
        # via each package's dart_test.yaml.
        # -j 2 because dart test parallelises its own suites too.
        run: rask test -j 2

      - name: Test aim_edge integration (wrangler dev)
        # The one tagged suite CI is equipped for: Node is set up and
        # wrangler is already warmed above.
        working-directory: packages/aim_edge
        run: dart test -t integration --run-skipped
