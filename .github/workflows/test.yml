name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Node (wrangler for aim_edge tests)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-wrangler

      - name: Warm wrangler
        run: npx --yes wrangler@4 --version

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-

      - name: Get dependencies
        run: dart pub get

      - name: Install rask
        # The command comes from pub.dev; the library rask.dart compiles
        # against is pinned by the root pubspec (dev_dependencies: rask).
        run: |
          dart install rask_cli
          echo "${XDG_DATA_HOME:-$HOME/.local/share}/dart/install/bin" >> "$GITHUB_PATH"

      - name: Analyze
        # rask.dart's analyze task adds --fatal-warnings; runs per package, in parallel.
        run: rask analyze -j 4

      - name: Test
        # The same twelve packages CI ran before rask; aim_postgres keeps its
        # unit-only run below because its integration tests need Docker.
        # -j 2 because dart test parallelises its own suites too.
        run: >-
          rask test -j 2
          -F aim_core -F aim_server -F aim_edge -F aim_cli
          -F aim_server_form -F aim_server_multipart -F aim_server_testing -F aim_server_static
          -F aim_server_logger -F aim_server_sse -F aim_server_jwt -F aim_server_basic_auth

      - name: Test aim_postgres (unit only, no Docker)
        working-directory: packages/aim_postgres
        run: dart test test/unit/
