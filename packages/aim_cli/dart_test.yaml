# Several command tests (create_command_test.dart, db_generate_command_test.dart)
# exercise CLI commands that resolve relative paths from Directory.current.
# That setter is a single OS-process attribute, not isolate-local, so letting
# `dart test` run those files concurrently (its default) races: one test's
# `Directory.current = tmp` clobbers another's mid-run. Forcing serial
# execution keeps each test's working directory change from leaking into
# another running test.
concurrency: 1

tags:
  # Needs Docker and a Postgres container. Run it with
  # `dart test -t integration --run-skipped`.
  integration:
    skip: "needs Docker; run with -t integration --run-skipped"
